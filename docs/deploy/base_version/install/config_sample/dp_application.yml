spring:
  application:
    name: alertworker-processor
  config:
    import:
      - nacos:shared-config.yaml
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:172.168.1.249:28848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:123.com}
        namespace: ${NACOS_NAMESPACE:release}
        group: DEFAULT_GROUP
        file-extension: yaml
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 18086
  # 工程前缀 /pw/alertworker + 模块前缀 /dp；完整路径 /pw/alertworker/dp/api/v1/**
  servlet:
    context-path: /pw/alertworker/dp

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

alertworker:
  rabbitmq:
    exchange: alertworker.exchange
    routing-key: alertworker.routing.key
    queue: alertworker.queue
    dlq: alertworker.dlq
    dlx: alertworker.dlx
  scheduler:
    tick-ms: 60000
  node:
    enabled: true
    type: PROCESSOR
    host: ${NODE_HOST:}
  # alertworker.storage 不在本地定义：运行时以 Nacos shared-config.yaml 为唯一来源（详见对象存储配置文档）。
  # 本地开发未配置时 StorageProperties 默认 type=local，走 LocalFileStorage 落盘。
