spring:
  application:
    name: alertworker-worker
  config:
    import:
      - nacos:shared-config.yaml?refreshEnabled=true
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:172.168.1.249:28848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:123.com}
        namespace: ${NACOS_NAMESPACE:release}
        group: DEFAULT_GROUP
        file-extension: yaml
  # #AI-CODE-CLASS-dev_release/v0.0.1-20260804: datasource moved to nacos shared-config.yaml
  flyway:
    enabled: false                    # 建议：迁移只由 datamanager 执行（或启动时用 SPRING_FLYWAY_ENABLED=false）
    locations: classpath:db/migration/{vendor}
    baseline-on-migrate: true

server:
  port: 8082
  # #AI-CODE-FUNCTION-dev_release/v0.0.1-20260908: 工程前缀 /pw/alertworker + 模块前缀 /worker
  # 完整路径 /pw/alertworker/worker/api/v1/**
  servlet:
    context-path: /pw/alertworker/worker

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

alertworker:
  rabbitmq:
    exchange: alertworker.exchange
    routing-key: alertworker.routing.key
    queue: alertworker.queue
    dlq: alertworker.dlq
    dlx: alertworker.dlx
  node:
    enabled: true
    type: WORKER
    host: ${NODE_HOST:}
