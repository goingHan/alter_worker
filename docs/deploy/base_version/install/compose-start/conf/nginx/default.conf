# AlertWorker 管理控制台 + API 反向代理
#
# URL 结构 = 工程前缀 /pw/alertworker + 应用前缀：
#   前端         /pw/alertworker/ui/**        -> 静态资源（SPA，回退 index.html）
#   gateway      /pw/alertworker/gw/**        -> gateway:8081（告警接入、死信重试、通道测试）
#   datamanager  /pw/alertworker/dm/**        -> datamanager:8083（配置 CRUD、告警历史、SSE）
#   worker       /pw/alertworker/worker/**    -> worker:8082（不经 nginx，仅供网内调用）
#   processor    /pw/alertworker/dp/**        -> processor:8084（周期任务手动触发）
#
# 后端 upstream：未来扩多节点时在 upstream 内追加 server 即可。

upstream alertworker_datamanager {
    server datamanager:8083;
    # server <第二节点>:8083;
}

upstream alertworker_gateway {
    server gateway:8081;
    # server <第二节点>:8081;
}

upstream alertworker_processor {
    server processor:8084;
    # server <第二节点>:8084;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # ---------- gateway（/pw/alertworker/gw/api/v1/**） ----------
    location /pw/alertworker/gw/ {
        proxy_pass http://alertworker_gateway;
        include /etc/nginx/alertworker-proxy-headers.conf;
        proxy_read_timeout 60s;
    }

    # ---------- SSE 实时告警推送（datamanager，关闭缓冲） ----------
    location /pw/alertworker/dm/api/v1/sse/ {
        proxy_pass http://alertworker_datamanager;
        include /etc/nginx/alertworker-proxy-headers.conf;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }

    # ---------- datamanager（/pw/alertworker/dm/api/v1/**） ----------
    location /pw/alertworker/dm/ {
        proxy_pass http://alertworker_datamanager;
        include /etc/nginx/alertworker-proxy-headers.conf;
        proxy_read_timeout 300s;
    }

    # ---------- processor（/pw/alertworker/dp/api/v1/**）：周期任务手动触发 ----------
    location /pw/alertworker/dp/ {
        proxy_pass http://alertworker_processor;
        include /etc/nginx/alertworker-proxy-headers.conf;
        proxy_read_timeout 300s;
    }

    # ---------- 前端 SPA（/pw/alertworker/ui/**，多前端项目时按前缀隔离） ----------
    # ^~ 防止通用静态资源正则 location 截走带哈希的 js/css/svg（否则落到默认 root 导致 404）
    location ^~ /pw/alertworker/ui/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /pw/alertworker/ui/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /pw/alertworker/ui/index.html;
        # index.html 协商缓存：发版即生效；带哈希的长缓存只给 assets
        add_header Cache-Control "no-cache";
    }

    # 根路径跳转到控制台
    location = / {
        return 302 /pw/alertworker/ui/;
    }
}
