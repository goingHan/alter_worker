<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 750" width="960" height="750">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="960" height="750" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#111827">AlertWorker Message Flow (Sequence Diagram)</text>

  <!-- Participants -->
  <rect x="20" y="50" width="120" height="36" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="80" y="73" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Prometheus/Client</text>
  <line x1="80" y1="86" x2="80" y2="720" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5,3"/>

  <rect x="220" y="50" width="120" height="36" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="280" y="73" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">MessageGateway</text>
  <line x1="280" y1="86" x2="280" y2="720" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5,3"/>

  <rect x="420" y="50" width="120" height="36" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="480" y="73" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">PostgreSQL</text>
  <line x1="480" y1="86" x2="480" y2="720" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5,3"/>

  <rect x="620" y="50" width="120" height="36" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="680" y="73" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">RabbitMQ</text>
  <line x1="680" y1="86" x2="680" y2="720" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5,3"/>

  <rect x="820" y="50" width="120" height="36" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="880" y="73" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Worker</text>
  <line x1="880" y1="86" x2="880" y2="720" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Activation boxes -->
  <rect x="270" y="110" width="20" height="120" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <rect x="870" y="310" width="20" height="150" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>

  <!-- Messages -->
  <line x1="80" y1="100" x2="280" y2="100" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="130" y="82" width="100" height="16" fill="#ffffff" opacity="0.95" rx="2"/>
  <text x="180" y="95" text-anchor="middle" font-size="11" fill="#374151">POST /alert</text>

  <line x1="280" y1="130" x2="480" y2="130" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="310" y="112" width="140" height="16" fill="#ffffff" opacity="0.95" rx="2"/>
  <text x="380" y="125" text-anchor="middle" font-size="11" fill="#374151">query AlertRule &amp; Template</text>

  <line x1="480" y1="160" x2="280" y2="160" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow-dashed)"/>
  <rect x="310" y="142" width="140" height="16" fill="#ffffff" opacity="0.95" rx="2"/>
  <text x="380" y="155" text-anchor="middle" font-size="11" fill="#374151">rule, template, recipients</text>

  <line x1="280" y1="190" x2="680" y2="190" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="430" y="172" width="100" height="16" fill="#ffffff" opacity="0.95" rx="2"/>
  <text x="480" y="185" text-anchor="middle" font-size="11" fill="#374151">publish(message)</text>

  <line x1="680" y1="300" x2="880" y2="300" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow-dashed)"/>
  <rect x="730" y="282" width="100" height="16" fill="#ffffff" opacity="0.95" rx="2"/>
  <text x="780" y="295" text-anchor="middle" font-size="11" fill="#374151">consume(message)</text>

  <line x1="880" y1="330" x2="960" y2="330" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="900" y="312" width="40" height="16" fill="#ffffff" opacity="0.95" rx="2"/>
  <text x="920" y="325" text-anchor="middle" font-size="11" fill="#374151">send()</text>

  <line x1="960" y1="360" x2="880" y2="360" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow-dashed)"/>
  <rect x="900" y="342" width="40" height="16" fill="#ffffff" opacity="0.95" rx="2"/>
  <text x="920" y="355" text-anchor="middle" font-size="11" fill="#374151">result</text>

  <line x1="880" y1="390" x2="480" y2="390" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="630" y="372" width="100" height="16" fill="#ffffff" opacity="0.95" rx="2"/>
  <text x="680" y="385" text-anchor="middle" font-size="11" fill="#374151">UPDATE status</text>

  <line x1="480" y1="420" x2="880" y2="420" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow-dashed)"/>
  <rect x="630" y="402" width="40" height="16" fill="#ffffff" opacity="0.95" rx="2"/>
  <text x="680" y="415" text-anchor="middle" font-size="11" fill="#374151">OK</text>

  <line x1="880" y1="450" x2="680" y2="450" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow-dashed)"/>
  <rect x="730" y="432" width="40" height="16" fill="#ffffff" opacity="0.95" rx="2"/>
  <text x="780" y="445" text-anchor="middle" font-size="11" fill="#374151">ack</text>

  <!-- DingDing lifeline (partial) -->
  <text x="920" y="40" text-anchor="middle" font-size="12" fill="#6b7280">DingDing</text>
  <line x1="960" y1="50" x2="960" y2="720" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Legend -->
  <g transform="translate(20, 660)">
    <line x1="0" y1="8" x2="30" y2="8" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="36" y="12" fill="#6b7280" font-size="12">Request / Action</text>
    <line x1="0" y1="28" x2="30" y2="28" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow-dashed)"/>
    <text x="36" y="32" fill="#6b7280" font-size="12">Response / Async</text>
  </g>
</svg>