spring:
  application:
    name: alertworker-processor
  config:
    import:
      - nacos:shared-config.yaml?refreshEnabled=true
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:172.168.1.249:28848}
        namespace: ${NACOS_NAMESPACE:business_test}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:123.com}
        group: DEFAULT_GROUP
        file-extension: yaml
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8084
  # 工程前缀 /pw/alertworker + 模块前缀 /dp；完整路径 /pw/alertworker/dp/api/v1/**
  servlet:
    context-path: /pw/alertworker/dp

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

alertworker:
  rabbitmq:
    exchange: alertworker.exchange
    routing-key: alertworker.routing.key
    queue: alertworker.queue
    dlq: alertworker.dlq
    dlx: alertworker.dlx
  # data-processor scheduler tick (advisory-locked so only one instance runs a tick)
  scheduler:
    tick-ms: 60000
  node:
    enabled: true
    type: PROCESSOR
    host: ${NODE_HOST:}
  # #AI-CODE-FUNCTION-dev_release/v0.0.2-20261009: alertworker.storage has NO local default here on purpose —
  # Nacos (shared-config.yaml) is the single runtime source. Without it, StorageProperties falls back to type=local
  # (LocalFileStorage) for local development. Override temporarily with ALERTWORKER_STORAGE_* env vars if needed.
