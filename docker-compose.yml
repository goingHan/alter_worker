version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: alertworker-postgres
    environment:
      POSTGRES_DB: alertworker
      POSTGRES_USER: alertworker
      POSTGRES_PASSWORD: alertworker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U alertworker -d alertworker" ]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: alertworker-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: alertworker
      RABBITMQ_DEFAULT_PASS: alertworker
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: alertworker-nacos
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: postgresql
      NACOS_AUTH_ENABLE: false
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos_data:/home/nacos/data

volumes:
  postgres_data:
  rabbitmq_data:
  nacos_data:
