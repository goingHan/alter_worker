spring:
  application:
    name: alertworker-datamanager
  config:
    import:
      - nacos:shared-config.yaml
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:172.168.1.249:28848}
        # #AI-CODE-CLASS-dev_release/v0.0.1-20260804: add nacos auth username/password
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:123.com}
        namespace: ${NACOS_NAMESPACE:business_test}
        group: DEFAULT_GROUP
        file-extension: yaml
  # #AI-CODE-CLASS-dev_release/v0.0.1-20260804: datasource moved to nacos shared-config.yaml
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080


mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
